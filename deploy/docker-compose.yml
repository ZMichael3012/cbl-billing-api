name: cbl-billing-api
services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cbl
      POSTGRES_PASSWORD: cbl
      POSTGRES_DB: billing
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbl -d billing"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cbl-net]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports: ["6379:6379"]
    networks: [cbl-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  billing-api:
    profiles: ["app"]
    build:
      context: ..
    environment:
      HTTP_ADDR: ":8010"
      METRICS_ADDR: ":9210"
      PG_DSN: postgres://cbl:cbl@postgres:5432/billing?sslmode=disable
      REDIS_ADDR: redis:6379
    ports:
      - "8010:8010"
      - "9210:9210"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [cbl-net]

volumes:
  pg-data:
  redis-data:

networks:
  cbl-net:
    driver: bridge
