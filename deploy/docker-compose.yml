name: cbl-billing-api
services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cbl
      POSTGRES_PASSWORD: cbl
      POSTGRES_DB: billing
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbl -d billing"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cbl-net]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports: ["6379:6379"]
    networks: [cbl-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  # reporting-stub - test reporting for the e2e of the /v1/reports proxy (11.4);
  # not part of the production contour, not published externally.
  reporting-stub:
    build:
      context: ..
      dockerfile: test/e2e/.additionals/reportingstub/Dockerfile
    environment:
      STUB_GRPC_ADDR: ":9000"
    networks: [cbl-net]
  billing-api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8010"
      METRICS_ADDR: ":9210"
      PG_DSN: postgres://cbl:cbl@postgres:5432/billing?sslmode=disable
      REDIS_ADDR: redis:6379
      MIGRATIONS_DIR: /app/migrations
      # Reports proxy (11.4): on the stand - the test reporting stub.
      REPORTING_GRPC_ADDR: reporting-stub:9000
      REPORTING_TIMEOUT: 5s
    ports:
      - "8010:8010"
      - "9210:9210"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      reporting-stub: { condition: service_started }
    networks: [cbl-net]

volumes:
  pg-data:
  redis-data:

networks:
  cbl-net:
    driver: bridge
